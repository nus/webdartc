# ffigen config for the pure-Dart VideoToolbox helper.
#
# Generates FFI bindings for the small subset of CoreFoundation, CoreVideo,
# CoreMedia, and VideoToolbox symbols we need. Filtering is aggressive —
# we only want what `webdartc_vt_helper.c` used to call.
#
# Run with: dart run ffigen --config ffigen.yaml
name: VtBindings
description: |
  Hand-curated bindings for the macOS/iOS VideoToolbox H.264 helper.
  Generated by ffigen from CoreFoundation/CoreVideo/CoreMedia/VideoToolbox
  headers; the include lists in ffigen.yaml control what gets emitted.
output: 'lib/codec/h264/videotoolbox/bindings.g.dart'
headers:
  entry-points:
    - 'src/vt_ffigen_bridge.h'
  include-directives:
    # Only emit declarations from these system headers; otherwise ffigen
    # walks the entire SDK transitively and emits thousands of unrelated
    # symbols.
    - '**CoreFoundation.framework/Headers/**'
    - '**CoreVideo.framework/Headers/**'
    - '**CoreMedia.framework/Headers/**'
    - '**VideoToolbox.framework/Headers/**'

compiler-opts:
  - '-isysroot'
  - '/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk'
  - '-F/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks'

functions:
  include:
    # CoreFoundation
    - 'CFRelease'
    - 'CFRetain'
    - 'CFArrayGetCount'
    - 'CFArrayGetValueAtIndex'
    - 'CFDictionaryCreate'
    - 'CFDictionaryContainsKey'
    - 'CFNumberCreate'
    # CoreVideo
    - 'CVPixelBufferCreate'
    - 'CVPixelBufferRelease'
    - 'CVPixelBufferLockBaseAddress'
    - 'CVPixelBufferUnlockBaseAddress'
    - 'CVPixelBufferGetBaseAddressOfPlane'
    - 'CVPixelBufferGetBytesPerRowOfPlane'
    - 'CVPixelBufferGetWidth'
    - 'CVPixelBufferGetHeight'
    - 'CVPixelBufferGetPixelFormatType'
    # CoreMedia
    - 'CMSampleBufferGetSampleAttachmentsArray'
    - 'CMSampleBufferGetDataBuffer'
    - 'CMSampleBufferGetFormatDescription'
    - 'CMSampleBufferCreate'
    - 'CMBlockBufferGetDataPointer'
    - 'CMBlockBufferCreateWithMemoryBlock'
    - 'CMVideoFormatDescriptionGetH264ParameterSetAtIndex'
    - 'CMVideoFormatDescriptionCreateFromH264ParameterSets'
    - 'CMVideoFormatDescriptionGetDimensions'
    - 'CMTimeMake'
    # VideoToolbox
    - 'VTCompressionSessionCreate'
    - 'VTCompressionSessionInvalidate'
    - 'VTCompressionSessionPrepareToEncodeFrames'
    - 'VTCompressionSessionEncodeFrame'
    - 'VTCompressionSessionCompleteFrames'
    - 'VTSessionSetProperty'
    - 'VTDecompressionSessionCreate'
    - 'VTDecompressionSessionInvalidate'
    - 'VTDecompressionSessionDecodeFrame'
    - 'VTDecompressionSessionWaitForAsynchronousFrames'

structs:
  include:
    - 'CMTime'
    - 'CMSampleTimingInfo'
    - 'CMVideoDimensions'
    - 'CFRange'
  rename:
    # The Apple SDK declares these toll-free CF/CV opaque structs with a
    # leading double-underscore (e.g. `__CFAllocator`). ffigen would emit
    # them as Dart-private classes, which breaks cross-file usage of the
    # corresponding `…Ref = Pointer<…>` typedefs. Strip the underscores so
    # the structs are public.
    '__CFAllocator': 'CFAllocator'
    '__CFArray': 'CFArray'
    '__CFDictionary': 'CFDictionary'
    '__CFBoolean': 'CFBoolean'
    '__CFNumber': 'CFNumber'
    '__CVBuffer': 'CVBuffer'

unnamed-enums:
  include:
    # OSType pixel formats and miscellaneous integer constants we use.
    - 'kCVPixelFormatType_420YpCbCr8Planar'
    - 'kCVPixelFormatType_420YpCbCr8BiPlanarFullRange'
    - 'kCVPixelFormatType_420YpCbCr8BiPlanarVideoRange'
    - 'kCVReturnSuccess'
    - 'kCMVideoCodecType_H264'

enums:
  include:
    - 'CFNumberType'
    - 'CVPixelBufferLockFlags'
    - 'VTEncodeInfoFlags'
    - 'VTDecodeInfoFlags'

globals:
  include:
    # CoreFoundation
    - 'kCFAllocatorDefault'
    - 'kCFAllocatorMalloc'
    - 'kCFBooleanTrue'
    - 'kCFTypeDictionaryKeyCallBacks'
    - 'kCFTypeDictionaryValueCallBacks'
    # CoreVideo
    - 'kCVPixelBufferIOSurfacePropertiesKey'
    - 'kCVPixelBufferPixelFormatTypeKey'
    # CoreMedia
    - 'kCMTimeInvalid'
    - 'kCMSampleAttachmentKey_NotSync'
    # VideoToolbox
    - 'kVTCompressionPropertyKey_RealTime'
    - 'kVTCompressionPropertyKey_AllowFrameReordering'
    - 'kVTCompressionPropertyKey_ProfileLevel'
    - 'kVTCompressionPropertyKey_AverageBitRate'
    - 'kVTCompressionPropertyKey_MaxKeyFrameInterval'
    - 'kVTCompressionPropertyKey_ExpectedFrameRate'
    - 'kVTProfileLevel_H264_Baseline_AutoLevel'
    - 'kVTEncodeFrameOptionKey_ForceKeyFrame'

typedefs:
  include:
    - 'OSStatus'
    - 'OSType'
    - 'Boolean'
    - 'CFTypeRef'
    - 'CFAllocatorRef'
    - 'CFArrayRef'
    - 'CFDictionaryRef'
    - 'CFNumberRef'
    - 'CFStringRef'
    - 'CFBooleanRef'
    - 'CVPixelBufferRef'
    - 'CVImageBufferRef'
    - 'CMSampleBufferRef'
    - 'CMBlockBufferRef'
    - 'CMFormatDescriptionRef'
    - 'CMVideoFormatDescriptionRef'
    - 'VTCompressionSessionRef'
    - 'VTDecompressionSessionRef'
    - 'VTCompressionOutputCallback'
    - 'VTDecompressionOutputCallback'
    - 'VTDecompressionOutputCallbackRecord'

preamble: |
  // GENERATED FILE — do not edit by hand. Regenerate with:
  //   dart run ffigen --config ffigen.yaml

  // ignore_for_file: type=lint, unused_field, camel_case_types, non_constant_identifier_names, constant_identifier_names, unused_element

comments:
  style: any
  length: brief
