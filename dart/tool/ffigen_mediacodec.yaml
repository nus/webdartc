# ffigen config TEMPLATE for the Android MediaCodec H.264 helper.
#
# Generates FFI bindings for the small subset of the NDK media APIs
# (AMediaCodec / AMediaFormat) the synchronous MediaCodec backend needs.
# Filtering is aggressive — only the symbols mediacodec_helper.dart calls.
#
# The `@NDK_*@` tokens below are machine-specific absolute paths (NDK install
# location, host triple, clang resource version), so this file is NOT run
# through ffigen directly. Instead:
#
#   dart run tool/gen_mediacodec_bindings.dart
#
# which resolves the NDK from the environment (ANDROID_NDK_HOME /
# ANDROID_HOME / the standard SDK locations — same logic as hook/build.dart),
# substitutes the tokens into a gitignored `tool/ffigen_mediacodec.local.yaml`,
# and invokes ffigen on that. Keeping the committed template token-based avoids
# baking a developer's `$HOME` path into version control.
name: MediaCodecBindings
description: |
  Hand-curated bindings for the Android NDK MediaCodec (AMediaCodec /
  AMediaFormat). Generated by ffigen from the NDK sysroot media headers; the
  include lists below control what gets emitted. Shared by every MediaCodec
  backend (H.264, VP8, Opus) — the C API is codec-agnostic (MIME-driven).
# Paths in this config are resolved relative to the config file (tool/), so the
# generated copy must also live in tool/ for this `output` to resolve.
output: '../lib/codec/mediacodec/bindings.g.dart'
# Use the NDK's own libclang so the bionic sysroot headers (which need a
# matching clang resource dir + __BIONIC_AVAILABILITY_GUARD) parse cleanly
# instead of leaking the host macOS SDK.
llvm-path:
  - '@NDK_LLVM@'
headers:
  entry-points:
    - '@NDK_SYSROOT@/usr/include/media/NdkMediaCodec.h'
    - '@NDK_SYSROOT@/usr/include/media/NdkMediaFormat.h'
    - '@NDK_SYSROOT@/usr/include/media/NdkMediaError.h'
  include-directives:
    # Only emit declarations from the NDK media headers; otherwise ffigen
    # walks the whole sysroot and emits thousands of unrelated symbols.
    - '**/media/NdkMediaCodec.h'
    - '**/media/NdkMediaFormat.h'
    - '**/media/NdkMediaError.h'
# Stop ffigen from auto-injecting the host macOS SDK's C standard library
# include path — we point clang at the NDK bionic sysroot instead.
compiler-opts-automatic:
  macos:
    include-c-standard-library: false
compiler-opts:
  - '--target=aarch64-linux-android34'
  # ffigen injects the host macOS `-isysroot` by default; override it (last
  # one wins) so clang reads the NDK bionic sysroot, not the macOS SDK.
  - '-isysroot'
  - '@NDK_SYSROOT@'
  # libclang (unlike the clang driver) doesn't auto-add the sysroot/builtin
  # include paths, so list them explicitly: clang builtins (stdint/stdbool),
  # the bionic sysroot, and the arch-specific bionic headers.
  - '-isystem'
  - '@NDK_CLANG_INC@'
  - '-isystem'
  - '@NDK_SYSROOT@/usr/include'
  - '-isystem'
  - '@NDK_SYSROOT@/usr/include/aarch64-linux-android'
  - '-x'
  - 'c'
functions:
  include:
    - 'AMediaCodec_createEncoderByType'
    - 'AMediaCodec_createDecoderByType'
    - 'AMediaCodec_configure'
    - 'AMediaCodec_start'
    - 'AMediaCodec_stop'
    - 'AMediaCodec_flush'
    - 'AMediaCodec_delete'
    - 'AMediaCodec_dequeueInputBuffer'
    - 'AMediaCodec_getInputBuffer'
    - 'AMediaCodec_queueInputBuffer'
    - 'AMediaCodec_dequeueOutputBuffer'
    - 'AMediaCodec_getOutputBuffer'
    - 'AMediaCodec_getOutputFormat'
    - 'AMediaCodec_releaseOutputBuffer'
    - 'AMediaFormat_new'
    - 'AMediaFormat_delete'
    - 'AMediaFormat_setString'
    - 'AMediaFormat_setInt32'
    - 'AMediaFormat_setBuffer'
    - 'AMediaFormat_getInt32'
    - 'AMediaFormat_getBuffer'
structs:
  include:
    - 'AMediaCodecBufferInfo'
globals:
  include:
    - 'AMEDIAFORMAT_KEY_MIME'
    - 'AMEDIAFORMAT_KEY_WIDTH'
    - 'AMEDIAFORMAT_KEY_HEIGHT'
    - 'AMEDIAFORMAT_KEY_BIT_RATE'
    - 'AMEDIAFORMAT_KEY_FRAME_RATE'
    - 'AMEDIAFORMAT_KEY_I_FRAME_INTERVAL'
    - 'AMEDIAFORMAT_KEY_COLOR_FORMAT'
    - 'AMEDIAFORMAT_KEY_STRIDE'
    - 'AMEDIAFORMAT_KEY_SLICE_HEIGHT'
typedefs:
  include:
    - 'media_status_t'
# media_status_t is an enum; its underlying integer type is
# implementation-defined. ffigen mimics the common ABI, which is correct for
# the Android arm64/x86_64 targets we run on.
silence-enum-warning: true
preamble: |
  // GENERATED FILE — do not edit by hand. Regenerate with:
  //   dart run tool/gen_mediacodec_bindings.dart

  // ignore_for_file: type=lint, unused_field, camel_case_types, non_constant_identifier_names, constant_identifier_names, unused_element
comments:
  style: any
  length: brief
