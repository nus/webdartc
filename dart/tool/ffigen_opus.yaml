name: OpusBindings
description: |
  Bindings for libopus (Xiph.org's reference Opus encoder/decoder, RFC 6716).
  Generated via: dart run ffigen --config tool/ffigen_opus.yaml
output: '../lib/codec/opus/opus_bindings.g.dart'
silence-enum-warning: true
llvm-path:
  - '/usr/lib/llvm-18/lib'
headers:
  entry-points:
    - '/usr/include/opus/opus.h'
    - '/usr/include/opus/opus_defines.h'
    - '/usr/include/opus/opus_types.h'
  include-directives:
    - '/usr/include/opus/**'
compiler-opts:
  - '-I/usr/include'
preamble: |
  // ignore_for_file: type=lint, type=warning, unused_field, unused_element, non_constant_identifier_names
  // Generated by ffigen. Do not edit manually.
functions:
  include:
    - 'opus_encoder_.*'
    - 'opus_decoder_.*'
    - 'opus_encode.*'
    - 'opus_decode.*'
    - 'opus_strerror'
    - 'opus_get_version_string'
structs:
  include:
    - 'OpusEncoder'
    - 'OpusDecoder'
macros:
  include:
    - 'OPUS_.*'
comments:
  style: any
  length: brief
