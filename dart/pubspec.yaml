name: webdartc
description: WebRTC library for Dart — RFC-compliant, I/O-isolated implementation.
version: 0.1.0

environment:
  sdk: '>=3.11.0 <4.0.0'

resolution: workspace

dependencies:
  archive: ^4.0.0
  code_assets: any
  crypto: ^3.0.0
  ffi: ^2.1.0
  hooks: any
  # Android-only: reaches the platform JCA crypto provider (java.security /
  # javax.crypto). Guarded behind Platform.isAndroid; unused on other OSes.
  jni: ^1.0.0
  native_toolchain_c: any

dev_dependencies:
  ffigen: ^19.0.0
  lints: ^5.0.0
  test: ^1.25.0
