name: Build libopus prebuilt

# Builds `webdartc_opus.dll` for Windows x64 and ARM64, statically linking
# vcpkg's opus port. The resulting zips are downloaded at end-user
# `dart pub get` time by `_bundleLibopusPrebuilt` in
# `dart/hook/build.dart`, so end users never need MSVC / vcpkg locally to
# consume libopus.
#
# Two trigger modes:
#   * workflow_dispatch — manual run, produces only Actions artifacts.
#     Use this to test workflow changes without cutting a release.
#   * push tag `opus-prebuilt-*` — produces artifacts AND uploads them as
#     assets on the matching GitHub release. Cut a release when you bump
#     either the libopus version (in `dart/tool/libopus_vcpkg/vcpkg.json`)
#     or `WRAPPER_REVISION` below.

on:
  workflow_dispatch:
  push:
    tags:
      - 'opus-prebuilt-*'

concurrency:
  group: build-libopus-prebuilt-${{ github.ref }}
  cancel-in-progress: false

env:
  # Bumps when the C wrapper source (dart/src/webdartc_opus.{c,h},
  # webdartc_export.h) changes but the pinned libopus version doesn't.
  # Encoded in the published zip filename and the build hook's expected
  # SHA-256 map.
  WRAPPER_REVISION: '1'

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            triplet: x64-windows-static
            arch: x64
            msvc_arch: x64
          - runner: windows-11-arm
            triplet: arm64-windows-static
            arch: arm64
            msvc_arch: arm64
    steps:
      - uses: actions/checkout@v6
        # We need only the wrapper source under `dart/src/` and this
        # workflow's vcpkg manifest. No submodules.
        with:
          submodules: false

      - name: Read libopus version from manifest
        id: ver
        run: |
          # Strip the vcpkg port-version suffix (e.g. 1.5.2#1 → 1.5.2).
          ver=$(jq -r '.overrides[0].version' dart/tool/libopus_vcpkg/vcpkg.json | sed 's/#.*//')
          echo "libopus_version=$ver" >> "$GITHUB_OUTPUT"
          echo "Pinned libopus version: $ver"

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.0'

      - name: Set up vcpkg
        # Full (non-shallow) clone — `builtin-baseline` in the manifest
        # checks out a historical commit (`versions/baseline.json` at that
        # commit), which a `--depth=1` clone wouldn't have.
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vcpkg" >> "$GITHUB_PATH"

      - name: Build webdartc_opus.dll
        # Single source of truth for "install libopus + compile wrapper" —
        # `dart/tool/build_libopus_wrappers.dart` runs the same logic from
        # the end-user source-build path in `dart/hook/build.dart`, so the
        # prebuilt and source-build outputs stay bit-compatible.
        # vcvarsall.bat is sourced inline so cl / link land in PATH for
        # this step only — no env leakage into the next step.
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS_PATH=%%i"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.msvc_arch }} >nul || exit /b 1
          :: The runner's env carries both `ProgramW6432` and `PROGRAMW6432`;
          :: MSBuild's .NET StringDictionary is case-sensitive and aborts the
          :: vcpkg → msbuild path with "Item has already been added. Key in
          :: dictionary: 'PROGRAMW6432' Key being added: 'ProgramW6432'".
          :: Clear and re-set so only a single canonical entry remains.
          set "_PW=%ProgramW6432%"
          set "ProgramW6432="
          set "PROGRAMW6432="
          set "ProgramW6432=%_PW%"
          set "_PW="
          dart run dart/tool/build_libopus_wrappers.dart ^
            --triplet=${{ matrix.triplet }} ^
            --manifest-dir=dart/tool/libopus_vcpkg ^
            --src-dir=dart/src ^
            --out-dir=staging

      - name: Assemble LICENSE + NOTICE
        run: |
          set -eux
          # vcpkg drops the upstream LICENSE under `share/opus/copyright`.
          cp "dart/tool/libopus_vcpkg/vcpkg_installed/${{ matrix.triplet }}/share/opus/copyright" staging/LICENSE
          cat > staging/NOTICE.txt <<EOF
          webdartc-libopus-prebuilt
          =========================

          This archive contains \`webdartc_opus.dll\` built by
          .github/workflows/build-libopus-prebuilt.yaml. The DLL
          statically links libopus (https://opus-codec.org/); its
          BSD-3 LICENSE is included verbatim in LICENSE.
          EOF

      - name: Verify exports (no libopus symbol leak)
        # Wrapper TU tags only `webdartc_*` symbols with __declspec(dllexport);
        # libopus is statically linked but its symbols stay internal.
        # dumpbin lives in VC Tools; source vcvarsall to find it.
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS_PATH=%%i"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.msvc_arch }} >nul || exit /b 1
          set "dll=staging\webdartc_opus.dll"
          dumpbin -nologo -exports "%dll%" > exports.txt
          findstr /C:"webdartc_opus_" exports.txt >nul || (
            echo ::error::No webdartc_opus_* exports found in %dll%
            type exports.txt
            exit /b 1
          )
          findstr /R " opus_[a-zA-Z]" exports.txt >nul && (
            echo ::error::libopus symbols leaked into %dll%
            exit /b 1
          )
          echo %dll% exports look clean.
          del exports.txt

      - name: Package zip
        id: pkg
        run: |
          set -eux
          name="webdartc-libopus-prebuilt-v${{ steps.ver.outputs.libopus_version }}-r${WRAPPER_REVISION}-win-${{ matrix.arch }}"
          (cd staging && 7z a -tzip "../$name.zip" .)
          sha256sum "$name.zip" > "$name.zip.sha256"
          echo "zip_name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: prebuilt-${{ matrix.arch }}
          path: |
            ${{ steps.pkg.outputs.zip_name }}.zip
            ${{ steps.pkg.outputs.zip_name }}.zip.sha256

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/opus-prebuilt-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          ls dist/
          # Create the release on first run for this tag; subsequent runs
          # just overwrite the assets via --clobber.
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --repo "${GITHUB_REPOSITORY}" \
                 --title "${GITHUB_REF_NAME}" \
                 --notes "Prebuilt \`webdartc_opus.dll\` for Windows x64 and ARM64, statically linking libopus via the vcpkg port. Generated by build-libopus-prebuilt.yaml."
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
