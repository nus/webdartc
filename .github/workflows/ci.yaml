name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]

jobs:
  # ── dart (pure Dart) ──────────────────────────────────────────────────
  # Resolve the dart package standalone (drop root workspace pubspec + the
  # member's `resolution: workspace` line) so the Dart-only jobs don't need
  # Flutter.
  dart-analyze:
    name: dart / Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.0'
      - name: Detach from workspace
        run: |
          rm -f pubspec.yaml
          sed -i '/^resolution: workspace$/d' dart/pubspec.yaml
      - working-directory: dart
        run: dart pub get
      - working-directory: dart
        run: dart analyze --fatal-infos

  dart-test-unit:
    name: dart / Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    defaults:
      # Force bash on every runner so the Detach-from-workspace step's
      # `rm`/`sed` works identically on Windows (via git-bash).
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.0'
      - if: runner.os == 'Linux'
        name: Install native build deps
        # libssl-dev: crypto FFI. yasm: required by libvpx's x86_64 SIMD
        # assembly. cmake comes preinstalled on ubuntu-latest. VP8 / VP9
        # / Opus / OpenH264 are vendored (OpenH264 as a Cisco prebuilt
        # download in dart/hook/build.dart) — no system codec packages
        # needed.
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev yasm
      - name: Detach from workspace
        run: |
          rm -f pubspec.yaml
          sed -i '' -e '/^resolution: workspace$/d' dart/pubspec.yaml 2>/dev/null \
            || sed -i '/^resolution: workspace$/d' dart/pubspec.yaml
      - working-directory: dart
        run: dart pub get
      - if: runner.os != 'Windows'
        working-directory: dart
        # `dart test` runs the build hook (dart/hook/build.dart): builds
        # the bundled libopus + libvpx (VP8 + VP9) on both macOS and
        # Linux, downloads the Cisco-prebuilt OpenH264 dylib on Linux,
        # plus the VideoToolbox callback shim on macOS. The opus and
        # libvpx submodules must be checked out (see
        # `submodules: recursive` above).
        run: dart test --exclude-tags e2e --timeout=60s
      - if: runner.os == 'Windows'
        working-directory: dart
        # Windows uses CNG (bcrypt.dll) for the crypto backend — no build
        # deps needed. Native-tagged tests stay excluded from this pass
        # (they need codec DLLs); the codec set we bundle is exercised
        # in the follow-up step.
        run: dart test --exclude-tags e2e,native --timeout=60s
      - if: runner.os == 'Windows'
        working-directory: dart
        # Codec tests for everything we bundle on Windows:
        #   - OpenH264 (Cisco prebuilt DLL, fetched by the build hook).
        #   - VP8 / VP9 (`vpx-prebuilt-*` release zip, fetched by
        #     `_bundleLibvpxPrebuilt` in dart/hook/build.dart).
        #   - libopus (`opus-prebuilt-*` release zip, fetched by
        #     `_bundleLibopusPrebuilt`).
        run: |
          dart test \
            test/codec/openh264_version_test.dart \
            test/codec/h264_encoder_test.dart \
            test/codec/h264_roundtrip_test.dart \
            test/codec/h264_openh264_multistream_test.dart \
            test/codec/vp8_encoder_test.dart \
            test/codec/vp8_encoder_multiframe_test.dart \
            test/codec/vp8_decoder_test.dart \
            test/codec/vp8_multistream_test.dart \
            test/codec/vp8_roundtrip_test.dart \
            test/codec/vp8_version_test.dart \
            test/codec/vp8_wire_format_test.dart \
            test/codec/vp9_multistream_test.dart \
            test/codec/vp9_roundtrip_test.dart \
            test/codec/vp9_version_test.dart \
            test/codec/opus_test.dart \
            test/codec/opus_libopus_update_test.dart \
            --timeout=120s

  dart-test-e2e-linux:
    name: dart / E2E Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.0'
      - name: Install native build deps
        # See dart-test-unit above for what each package is for.
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev yasm
      - name: Detach from workspace
        run: |
          rm -f pubspec.yaml
          sed -i '/^resolution: workspace$/d' dart/pubspec.yaml
      - working-directory: dart
        run: dart pub get
      - working-directory: dart
        # Runs the sendonly video_call test with VP8 and H.264 (via
        # OpenH264 on Linux). VP8 uses the bundled libvpx wrapper. The
        # bidirectional test is @TestOn('mac-os') so skipped.
        run: dart test test/e2e/ --timeout=180s

  dart-test-e2e-windows:
    name: dart / E2E Tests (Windows)
    runs-on: windows-latest
    defaults:
      # Same as dart-test-unit — the Detach-from-workspace step uses
      # `rm`/`sed` which need bash on Windows (git-bash).
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.0'
      - name: Detach from workspace
        run: |
          rm -f pubspec.yaml
          sed -i '' -e '/^resolution: workspace$/d' dart/pubspec.yaml 2>/dev/null \
            || sed -i '/^resolution: workspace$/d' dart/pubspec.yaml
      - working-directory: dart
        run: dart pub get
      - working-directory: dart
        # Stable subset for Windows E2E. The "webdartc as answerer"
        # scenarios (Chrome drives ICE pair selection) and the
        # unidirectional VP8 sample converge reliably on Windows; the
        # "webdartc as offerer with bidirectional receive" scenarios —
        # Scenario 1 (data channel), Scenario 2 (recvonly media),
        # Scenario 3 (Trickle ICE), the packet-loss group, and the
        # H.264 sample — are flaky because Chrome's chosen ICE pair
        # on its side doesn't always line up with the pair Dart picks,
        # and the ensuing DTLS direction gets dropped. Linux/macOS run
        # the full matrix and catch any cross-OS regression there.
        #
        # Firefox is skipped entirely — firefox_for_testing.dart
        # treats the upstream `.exe` installer as a zip and fails to
        # extract it; a future change can 7z-extract the NSIS
        # installer so we don't pollute HKLM.
        #
        # Even the "stable" subset hits a transient failure roughly
        # once every several CI runs (Chrome launch race, GCM
        # registration timeout, etc.) so we retry the whole command
        # up to three times before declaring failure.
        # `--concurrency=1` serialises the test files so the shared
        # Chrome for Testing download cache doesn't race.
        run: |
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"
            if dart test \
                 test/e2e/e2e_test.dart \
                 test/e2e/video_call_sample_test.dart \
                 -n "Scenario 1b|Scenario 4|Scenario 5|vp8 video frames" \
                 --concurrency=1 \
                 --timeout=180s
            then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Windows E2E attempt $attempt failed; retrying"
          done
          echo "::error::Windows E2E failed after 3 attempts"
          exit 1

  dart-test-e2e-macos:
    name: dart / E2E Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.0'
      - name: Detach from workspace
        run: |
          rm -f pubspec.yaml
          sed -i '' -e '/^resolution: workspace$/d' dart/pubspec.yaml
      - working-directory: dart
        run: dart pub get
      - working-directory: dart
        # VideoToolbox-only coverage: sendonly sample (H.264 via VT) +
        # bidirectional (browser → VT decoder). Chrome for Testing on
        # macOS has H.264 bundled.
        run: |
          dart test \
            test/e2e/video_call_sample_test.dart \
            test/e2e/video_call_bidir_test.dart \
            --timeout=180s

  # ── flutter (Flutter) ─────────────────────────────────────────────────
  flutter-analyze:
    name: flutter / Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - working-directory: flutter
        run: flutter analyze --fatal-infos

  flutter-test:
    name: flutter / Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - if: runner.os == 'Linux'
        # `flutter pub get` walks the workspace and triggers
        # dart/hook/build.dart, which configures + builds bundled libopus
        # and libvpx and downloads OpenH264 — needs cmake (preinstalled),
        # yasm (libvpx x86_64 SIMD asm), libssl-dev (crypto FFI).
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev yasm
      - run: flutter pub get
      - working-directory: flutter
        # Widget tests use a mock MethodChannel; native plugin code is not
        # loaded so this passes on Linux too.
        run: flutter test

  # Build the macOS example app and run the browser ↔ Flutter
  # bidirectional E2E test against it. The build step compiles the
  # plugin's Swift code, runs pod install, and exercises the dart build
  # hook that produces the VideoToolbox C helper. The E2E step then
  # spawns the signaling server, Chrome with a fake camera, and the
  # built Flutter app, and asserts frames flow in both directions.
  flutter-example-macos:
    name: flutter / Example build + bidir E2E (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - working-directory: flutter/example
        run: flutter build macos --debug
      - working-directory: dart
        # The workspace pubspec is intact (flutter-action brought Flutter
        # in), so dart test can resolve via the same root that just built
        # the Flutter app.
        run: dart test test/e2e/flutter_video_call_bidir_test.dart --timeout=180s

  # Build the Windows example app and run the plugin's C++ unit tests.
  # The unit-test exe is produced as a side effect of the example build
  # via the `include_${PROJECT_NAME}_tests` hook in
  # flutter/windows/CMakeLists.txt.
  flutter-example-windows:
    name: flutter / Plugin unit tests + example build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - working-directory: flutter/example
        run: flutter build windows --debug
      - working-directory: flutter/example
        run: ./build/windows/x64/plugins/webdartc_flutter/Debug/webdartc_flutter_test.exe
