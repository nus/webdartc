name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# All shared setup (checkout, language toolchain, pub cache, build-hook
# artifact cache, Chrome-for-Testing cache, workspace-detach) lives in
# `.github/actions/setup`. Per-job overrides are passed via the `with:`
# block of each `uses: ./.github/actions/setup` step.

jobs:
  # ── dart (pure Dart) ──────────────────────────────────────────────────
  dart-analyze:
    name: dart / Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          flavor: dart-analyze
          cache-hooks: 'false'
          install-linux-deps: 'false'
      - working-directory: dart
        run: dart analyze --fatal-infos

  dart-test-unit:
    name: dart / Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    defaults:
      # Force bash on every runner so the test command syntax is identical
      # on Windows (via git-bash).
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          flavor: dart
      - if: runner.os != 'Windows'
        working-directory: dart
        # `dart test` runs the build hook (dart/hook/build.dart): builds
        # libopus + libvpx (VP8 + VP9) — via vcpkg on macOS + Linux —
        # downloads the Cisco-prebuilt OpenH264 dylib on Linux, plus the
        # VideoToolbox callback shim on macOS.
        #
        # `coturn` is excluded here because most runners don't ship the
        # turnserver binary — the dedicated turn-integration job below
        # installs coturn and runs that tag.
        run: dart test --exclude-tags e2e,coturn --timeout=60s
      - if: runner.os == 'Windows'
        working-directory: dart
        # Windows uses CNG (bcrypt.dll) for the crypto backend — no build
        # deps needed. Native-tagged tests stay excluded from this pass
        # (they need codec DLLs); the codec set we bundle is exercised
        # in the follow-up step.
        run: dart test --exclude-tags e2e,native,coturn --timeout=60s
      - if: runner.os == 'Windows'
        working-directory: dart
        # Codec tests for everything we bundle on Windows:
        #   - OpenH264 (Cisco prebuilt DLL, fetched by the build hook).
        #   - VP8 / VP9 + libopus: the build hook source-builds the wrapper
        #     DLLs from libvpx / libopus via vcpkg + MSVC (vswhere locates
        #     the VC++ toolset preinstalled on windows runners; vcpkg is
        #     auto-bootstrapped). Cached across runs under the build-hook
        #     artifact cache.
        run: |
          dart test \
            test/codec/openh264_version_test.dart \
            test/codec/h264_encoder_test.dart \
            test/codec/h264_roundtrip_test.dart \
            test/codec/h264_openh264_multistream_test.dart \
            test/codec/vp8_encoder_test.dart \
            test/codec/vp8_encoder_multiframe_test.dart \
            test/codec/vp8_decoder_test.dart \
            test/codec/vp8_multistream_test.dart \
            test/codec/vp8_roundtrip_test.dart \
            test/codec/vp8_version_test.dart \
            test/codec/vp8_wire_format_test.dart \
            test/codec/vp9_multistream_test.dart \
            test/codec/vp9_roundtrip_test.dart \
            test/codec/vp9_version_test.dart \
            test/codec/opus_test.dart \
            test/codec/opus_libopus_update_test.dart \
            --timeout=120s

  dart-test-e2e-linux:
    name: dart / E2E Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          flavor: dart
          cache-chrome: 'true'
      - working-directory: dart
        # Runs the video_sender test with VP8 and H.264 (via OpenH264
        # on Linux). VP8 uses the bundled libvpx wrapper. The
        # video_receiver test is @TestOn('mac-os') so skipped.
        run: dart test test/e2e/ --timeout=180s

  dart-test-e2e-windows:
    name: dart / E2E Tests (Windows)
    runs-on: windows-latest
    defaults:
      # The retry-loop step below relies on bash heredoc syntax that
      # PowerShell can't run, so force bash on every step here (git-bash
      # on Windows runners).
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          flavor: dart
          cache-chrome: 'true'
      - working-directory: dart
        # Stable subset for Windows E2E. The "webdartc as answerer"
        # scenarios (Chrome drives ICE pair selection) and the
        # unidirectional video_sender samples (Dart sends VP8 / H.264,
        # the browser only decodes — no bidirectional ICE) converge
        # reliably on Windows; the "webdartc as offerer with
        # bidirectional receive" scenarios — Scenario 1 (data channel),
        # Scenario 2 (recvonly media), Scenario 3 (Trickle ICE), and the
        # packet-loss group — are flaky because Chrome's chosen ICE pair
        # on its side doesn't always line up with the pair Dart picks,
        # and the ensuing DTLS direction gets dropped. Linux/macOS run
        # the full matrix and catch any cross-OS regression there.
        #
        # Firefox is skipped entirely — firefox_for_testing.dart
        # treats the upstream `.exe` installer as a zip and fails to
        # extract it; a future change can 7z-extract the NSIS
        # installer so we don't pollute HKLM.
        #
        # Even the "stable" subset hits a transient failure roughly
        # once every several CI runs (Chrome launch race, GCM
        # registration timeout, etc.) so we retry the whole command
        # up to three times before declaring failure.
        # `--concurrency=1` serialises the test files so the shared
        # Chrome for Testing download cache doesn't race.
        run: |
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"
            if dart test \
                 test/e2e/e2e_test.dart \
                 test/e2e/video_sender_test.dart \
                 -n "Scenario 1b|Scenario 4|Scenario 5|video frames" \
                 --concurrency=1 \
                 --timeout=180s
            then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Windows E2E attempt $attempt failed; retrying"
          done
          echo "::error::Windows E2E failed after 3 attempts"
          exit 1

  dart-test-e2e-macos:
    name: dart / E2E Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          flavor: dart
          cache-chrome: 'true'
      - working-directory: dart
        # VideoToolbox-only coverage: video_sender (H.264 via VT) +
        # video_receiver (browser → VT decoder). Chrome for Testing on
        # macOS has H.264 bundled.
        run: |
          dart test \
            test/e2e/video_sender_test.dart \
            test/e2e/video_receiver_test.dart \
            --timeout=180s

  # ── coturn-backed TURN integration ────────────────────────────────────
  # Spawns a real coturn instance on an ephemeral port and asserts the
  # PeerConnection emits a relay candidate after Allocate. Linux-only —
  # coturn ships in the apt repos there; macOS / Windows runners would
  # need brew / a separate vcpkg recipe, deferred until needed.
  dart-turn-integration:
    name: dart / TURN Integration (Linux + coturn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          flavor: dart
      - name: Install coturn
        run: |
          sudo apt-get install -y coturn
          turnserver --version | head -1
      - working-directory: dart
        run: dart test --tags=coturn test/turn/ --timeout=60s

  # ── flutter (Flutter) ─────────────────────────────────────────────────
  flutter-analyze:
    name: flutter / Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          flavor: flutter
          cache-hooks: 'false'
          install-linux-deps: 'false'
      - working-directory: flutter
        run: flutter analyze --fatal-infos

  flutter-test:
    name: flutter / Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          flavor: flutter
      - working-directory: flutter
        # Widget tests use a mock MethodChannel; native plugin code is not
        # loaded so this passes on Linux too.
        run: flutter test

  # Build the macOS example app and run the browser ↔ Flutter
  # bidirectional E2E test against it. The build step compiles the
  # plugin's Swift code, runs pod install, and exercises the dart build
  # hook that produces the VideoToolbox C helper. The E2E step then
  # spawns the signaling server, Chrome with a fake camera, and the
  # built Flutter app, and asserts frames flow in both directions.
  flutter-example-macos:
    name: flutter / Example build + bidir E2E (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          flavor: flutter
          cache-chrome: 'true'
      - working-directory: flutter/example
        run: flutter build macos --debug
      - working-directory: dart
        # The workspace pubspec is intact (flutter-action brought Flutter
        # in), so dart test can resolve via the same root that just built
        # the Flutter app.
        run: dart test test/e2e/flutter_video_call_bidir_test.dart --timeout=180s

  # Build the Windows example app and run the plugin's C++ unit tests.
  # The unit-test exe is produced as a side effect of the example build
  # via the `include_${PROJECT_NAME}_tests` hook in
  # flutter/windows/CMakeLists.txt.
  flutter-example-windows:
    name: flutter / Plugin unit tests + example build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          flavor: flutter
      - working-directory: flutter/example
        run: flutter build windows --debug
      - working-directory: flutter/example
        run: ./build/windows/x64/plugins/webdartc_flutter/Debug/webdartc_flutter_test.exe

  # Cross-compile the example app's debug APK for arm64 — the production
  # Android ABI. This is the cheap, reliable gate: building the APK runs the
  # full native build hook (libvpx + libopus cross-compiled with the NDK,
  # BoringSSL via vcpkg) and compiles the Kotlin renderer plugin. arm64 keeps
  # its NEON intrinsics, so this guards the real shipping codepath; the x86_64
  # emulator job below covers on-device runtime behaviour.
  flutter-android-build:
    name: flutter / Android build (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          flavor: flutter
          install-android-ndk: 'true'
          # Distinct from the host-native Linux-X64 hooks key: this job
          # cross-compiles for android-arm64 on the same X64 runner, so it
          # must not collide with the dart/flutter X64 jobs' cache.
          cache-key-suffix: '-android-arm64'
      - working-directory: flutter/example
        # nasm + pkg-config for the BoringSSL vcpkg port come from the Linux
        # setup step; cmake is preinstalled on ubuntu-latest.
        run: flutter build apk --debug --target-platform=android-arm64

  # Run the Dart package's platform-relevant tests ON-DEVICE via the
  # integration_test aggregator (crypto, VP8/VP9, opus, H.264 MediaCodec,
  # PeerConnection). Uses an x86_64 emulator on ubuntu-latest: GitHub's hosted
  # Apple-Silicon runners can't accelerate an arm64 emulator (no nested HVF),
  # and the hosted Linux arm64 runners have no /dev/kvm — so an accelerated
  # x86_64 emulator under KVM on the x64 Linux runner is the only viable hosted
  # path. The build hook builds all three native deps for x86_64-android:
  # libvpx assembles its x86 SIMD with nasm (see _androidLibvpxEnv in
  # dart/hook/build.dart — needs nasm + readelf on the runner), libopus +
  # BoringSSL build straight from source.
  flutter-android-integration:
    name: flutter / Android integration tests (x86_64 emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          flavor: flutter
          install-android-ndk: 'true'
          # Cross-compiles for android-x86_64 on the X64 runner — a different
          # target than both the host-native X64 jobs and the android-arm64
          # build gate, so it needs its own hooks-cache key.
          cache-key-suffix: '-android-x64'
      # `flutter test integration_test`, run from the example dir inside the
      # pub workspace, anchors to the workspace root and can't see the
      # example's integration_test dev_dependency ("cannot run without a
      # dependency on package:integration_test" — the example isn't a workspace
      # member, and making it one would force every member onto one lints
      # version). Drop the workspace root pubspec + the members'
      # `resolution: workspace` lines so the example resolves standalone (as it
      # does for a developer running the test locally), then pre-resolve it.
      - name: Detach example from the pub workspace
        run: |
          rm -f pubspec.yaml
          sed -i '/^resolution: workspace$/d' flutter/pubspec.yaml dart/pubspec.yaml
          (cd flutter/example && flutter pub get)
      # KVM lets the x86_64 emulator boot accelerated (reactivecircus's
      # recommended udev rule to grant the runner access to /dev/kvm).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Cache the AVD + its warm snapshot so the emulator restores from a
      # snapshot instead of cold-booting (~40-60s) every run. Keyed by the
      # dimensions that define the image (api-level / arch / target).
      - name: Cache AVD snapshot
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # -v1 is a manual bump token: the dimensions below don't change on
          # their own, so bump it to force a fresh snapshot if a system-image
          # update makes the cached one stale.
          key: avd-x86_64-api35-google_apis-v1
      # On a cache miss, create the AVD and write a booted snapshot. Runs only
      # when the cache is cold; its emulator-options omit -no-snapshot-save so
      # the snapshot is persisted for the next run to restore.
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: echo "AVD snapshot generated."
      - name: Run integration tests on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          # -no-snapshot-save: boot from the cached snapshot but don't rewrite
          # it (the Create AVD snapshot step above owns snapshot generation).
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # `flutter test integration_test` builds only the emulator's ABI
          # (x86_64).
          script: |
            cd flutter/example
            flutter test integration_test/dart_suite_test.dart -d emulator-5554 --timeout=300s
