name: webdartc CI setup
description: |
  Checkout (+ submodules), language toolchain, pub cache, optional
  build-hook artifact cache, optional Chrome-for-Testing cache, and the
  workspace-detach dance for Dart-only jobs.

inputs:
  flavor:
    description: 'dart-analyze | dart | flutter'
    required: true
  cache-hooks:
    description: 'Cache the native-asset build artifacts under dart/.dart_tool/hooks_runner/shared/webdartc/'
    default: 'true'
  cache-key-suffix:
    description: 'Extra suffix appended to the build-hook cache key. Needed when a job cross-compiles for a different target on the same host (e.g. an android-arm64 build on a Linux-X64 runner) so it does not collide with the host-native jobs key.'
    default: ''
  cache-chrome:
    description: 'Cache the Chrome-for-Testing download under dart/.local/chrome_for_testing/'
    default: 'false'
  install-linux-deps:
    description: 'apt-install nasm + pkg-config on Linux runners (everything that runs the build hook needs them)'
    default: 'true'
  install-android-ndk:
    description: 'sdkmanager-install the Android NDK (pinned to flutter.ndkVersion) and export ANDROID_NDK_HOME, for jobs that cross-compile the build hook for Android'
    default: 'false'

runs:
  using: composite
  steps:
    # Caller MUST `uses: actions/checkout@v6 with: submodules: recursive`
    # before invoking this action — composite actions in `./.github/actions`
    # cannot exist on the runner before the checkout step.
    - if: ${{ inputs.flavor == 'dart-analyze' || inputs.flavor == 'dart' }}
      uses: dart-lang/setup-dart@v1
      with:
        sdk: '3.11.0'

    - if: ${{ inputs.flavor == 'flutter' }}
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        # Cache the resolved Flutter SDK so subsequent runs skip the
        # ~20 s download/extract step.
        cache: true

    - name: Cache pub
      uses: actions/cache@v5
      with:
        # macOS / Linux use ~/.pub-cache; Windows uses %LOCALAPPDATA%\Pub\Cache.
        # actions/cache silently skips paths that don't exist on the host.
        path: |
          ~/.pub-cache
          ~/AppData/Local/Pub/Cache
        # `flavor` is part of the key because dart-flavor jobs resolve
        # against a *detached* pubspec (root pubspec.yaml removed +
        # `resolution: workspace` line dropped from dart/pubspec.yaml)
        # while flutter-flavor jobs resolve against the intact workspace
        # — same source pubspecs, different resolved package sets.
        key: pub-${{ runner.os }}-${{ inputs.flavor }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
        restore-keys: |
          pub-${{ runner.os }}-${{ inputs.flavor }}-

    - if: ${{ runner.os == 'Linux' && inputs.install-linux-deps == 'true' }}
      name: Install native build deps
      # nasm: assembles libvpx's x86_64 SIMD (vcpkg libvpx port) and vcpkg's
      # BoringSSL crypto. libvpx prefers yasm but falls back to nasm; the
      # BoringSSL port requires nasm specifically and only auto-acquires it on
      # Windows — on Linux it must come from the system, so nasm covers both.
      # pkg-config: the BoringSSL, libvpx and opus ports all run
      # vcpkg_fixup_pkgconfig during install. cmake comes preinstalled on
      # ubuntu-latest. The build hook source-builds BoringSSL (crypto) +
      # libvpx + opus via vcpkg — which it clones + bootstraps itself — so no
      # libssl-dev. OpenH264 is downloaded prebuilt.
      # binutils: libvpx's android-x86_64 configure probes the assembler with
      # `readelf -WS` (build/make/configure.sh); without it the nasm check fails
      # ("does not support section alignment"). Preinstalled on ubuntu-latest,
      # pinned here so the android-x86_64 integration build can't regress on it.
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm pkg-config binutils

    - if: ${{ inputs.install-android-ndk == 'true' }}
      name: Pin Android NDK version
      # Single source of truth for the NDK version — matches flutter.ndkVersion
      # (flutter/example/android/app/build.gradle.kts). Bump here only. The cache
      # + install steps below reference $NDK_VERSION / env.NDK_VERSION.
      shell: bash
      run: echo "NDK_VERSION=28.2.13676358" >> "$GITHUB_ENV"

    - if: ${{ inputs.install-android-ndk == 'true' }}
      name: Cache Android NDK
      # Keyed by os + arch: the Linux and macOS (and per-arch) NDKs are
      # different host toolchains, so they can't share a cache entry — same
      # convention as the build-hook key below.
      uses: actions/cache@v5
      with:
        path: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        key: ndk-${{ runner.os }}-${{ runner.arch }}-${{ env.NDK_VERSION }}

    - if: ${{ inputs.install-android-ndk == 'true' }}
      name: Install Android NDK
      # Skip the sdkmanager install when the NDK is already present (cache hit,
      # or preinstalled on the runner) — only the ANDROID_NDK_HOME export has to
      # run every time, so the build hook + Gradle can resolve it.
      shell: bash
      run: |
        ndk_dir="$ANDROID_HOME/ndk/$NDK_VERSION"
        [ -d "$ndk_dir" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
        echo "ANDROID_NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"

    - if: ${{ inputs.flavor == 'dart-analyze' || inputs.flavor == 'dart' }}
      name: Detach from workspace
      # Drop the root workspace pubspec + the member's `resolution:
      # workspace` line so the Dart-only jobs don't need Flutter. Dual
      # sed handles both BSD (macOS) and GNU (Linux + git-bash on
      # Windows) syntax.
      shell: bash
      run: |
        rm -f pubspec.yaml
        sed -i '' -e '/^resolution: workspace$/d' dart/pubspec.yaml 2>/dev/null \
          || sed -i '/^resolution: workspace$/d' dart/pubspec.yaml

    - if: ${{ inputs.cache-hooks == 'true' }}
      name: Compute build cache key
      id: build_cache_key
      # `git rev-parse HEAD:<path>` returns the SHA the parent tree pins
      # for the submodule, so the key invalidates exactly when libvpx /
      # opus is bumped — without hashing the submodule's entire content.
      shell: bash
      run: |
        OPUS=$(git rev-parse HEAD:dart/third_party/opus | head -c12)
        VPX=$(git rev-parse HEAD:dart/third_party/libvpx | head -c12)
        echo "submods=$OPUS-$VPX" >> "$GITHUB_OUTPUT"

    - if: ${{ inputs.cache-hooks == 'true' }}
      name: Cache build hook artifacts
      uses: actions/cache@v5
      with:
        path: dart/.dart_tool/hooks_runner/shared/webdartc
        # `submods` pins the Android codec source (the libvpx / opus
        # submodules). The vcpkg manifests + overlay triplets pin the
        # macOS/Linux/Windows codec source (and the BoringSSL crypto port), so
        # hashing them invalidates the cache exactly when a vcpkg-pinned
        # version is bumped.
        key: hooks-${{ runner.os }}-${{ runner.arch }}-${{ steps.build_cache_key.outputs.submods }}-${{ hashFiles('dart/hook/build.dart', 'dart/src/**', 'dart/tool/**/vcpkg.json', 'dart/tool/vcpkg_triplets/**') }}${{ inputs.cache-key-suffix }}

    - if: ${{ inputs.cache-chrome == 'true' }}
      name: Cache Chrome for Testing
      uses: actions/cache@v5
      with:
        path: dart/.local/chrome_for_testing
        key: chrome-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dart/test/e2e/chrome_for_testing.dart') }}

    - if: ${{ inputs.flavor == 'dart-analyze' || inputs.flavor == 'dart' }}
      name: dart pub get
      shell: bash
      working-directory: dart
      run: dart pub get

    - if: ${{ inputs.flavor == 'flutter' }}
      name: flutter pub get
      shell: bash
      run: flutter pub get
