name: 'Set up MSVC dev environment'
description: >-
  Source vcvarsall.bat for the given target architecture and export
  only the env vars vcvarsall actually changes to subsequent steps
  via $GITHUB_ENV. vswhere.exe locates the installed Visual Studio
  regardless of edition (Enterprise / Community / BuildTools).
inputs:
  arch:
    description: 'MSVC target architecture (x64, arm64, x86_amd64, etc.)'
    required: true
runs:
  using: composite
  steps:
    - shell: pwsh
      # Forwarding every `set`-line into $GITHUB_ENV re-exports
      # runner-managed vars under cmd's casing (e.g. PROGRAMW6432
      # alongside the runner's ProgramW6432), and MSBuild then
      # rejects the duplicate ("Item has already been added.") when
      # spawning CL. Restrict the forwarded set to keys vcvarsall
      # actually owns: the compile-search vars plus the VS / SDK
      # introspection prefixes.
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        $vcvars = "$vsPath\VC\Auxiliary\Build\vcvarsall.bat"

        $vcEnvPattern = '^(PATH|INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsRedistDir|VCToolsVersion|VCIDEInstallDir|DevEnvDir|VSINSTALLDIR|VisualStudioVersion|CommandPromptType|Platform|WindowsSdk[^=]*|WindowsSDK[^=]*|WindowsLibPath|UCRTVersion|UniversalCRTSdkDir|VSCMD_[^=]*|Framework[^=]*|NETFXSDKDir|ExtensionSdkDir)$'

        $changed = [System.Collections.Generic.List[string]]::new()
        foreach ($line in & cmd /c "`"$vcvars`" ${{ inputs.arch }} >NUL && set") {
          if ($line -match '^([^=]+)=(.*)$') {
            # Cache the value before the next `-match` clobbers $matches.
            $key = $matches[1]
            $val = $matches[2]
            if ($key -match $vcEnvPattern) {
              $changed.Add("$key=$val")
            }
          }
        }
        $changed | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
