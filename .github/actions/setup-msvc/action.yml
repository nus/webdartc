name: 'Set up MSVC dev environment'
description: >-
  Source vcvarsall.bat for the given target architecture. New PATH
  entries are appended via $GITHUB_PATH (which prepends them to PATH
  for subsequent steps); other VC env vars go through $GITHUB_ENV.
  vswhere.exe locates the installed Visual Studio regardless of
  edition (Enterprise / Community / BuildTools).
inputs:
  arch:
    description: 'MSVC target architecture (x64, arm64, x86_amd64, etc.)'
    required: true
runs:
  using: composite
  steps:
    - shell: pwsh
      # Forwarding a full `Path=...` line via $GITHUB_ENV has tripped
      # MSBuild ("Item has already been added. Key in dictionary
      # 'PROGRAMW6432' Key being added 'ProgramW6432'") when vcpkg
      # later spawns CL — easier to feed only the new path entries
      # via the dedicated $GITHUB_PATH channel and leave PATH itself
      # alone.
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        $vcvars = "$vsPath\VC\Auxiliary\Build\vcvarsall.bat"

        $envAfter = @{}
        foreach ($line in & cmd /c "`"$vcvars`" ${{ inputs.arch }} >NUL && set") {
          if ($line -match '^([^=]+)=(.*)$') {
            $envAfter[$matches[1]] = $matches[2]
          }
        }

        # New PATH entries — anything vcvarsall prepended.
        $beforePath = ($env:PATH -split ';') | Where-Object { $_ }
        $afterPath = ($envAfter['Path'] -split ';') | Where-Object { $_ }
        $newPathEntries = $afterPath | Where-Object { $_ -notin $beforePath }
        if ($newPathEntries.Count -gt 0) {
          $newPathEntries | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8NoBOM
        }

        # Compile-search and VS / SDK introspection vars vcvarsall owns.
        $vcKeyPattern = '^(INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsRedistDir|VCToolsVersion|VCIDEInstallDir|DevEnvDir|VSINSTALLDIR|VisualStudioVersion|CommandPromptType|Platform|WindowsSdk[^=]*|WindowsLibPath|UCRTVersion|UniversalCRTSdkDir|VSCMD_[^=]*|Framework[^=]*|NETFXSDKDir|ExtensionSdkDir)$'
        $changed = [System.Collections.Generic.List[string]]::new()
        foreach ($k in $envAfter.Keys) {
          if ($k -match $vcKeyPattern) {
            $changed.Add("$k=$($envAfter[$k])")
          }
        }
        if ($changed.Count -gt 0) {
          $changed | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
        }
